name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Backend Unit Tests & RAG Evaluation
    runs-on: ubuntu-latest
    env:
      LEXAI_ENV: test
      LEXAI_RENDER_FREE_MODE: "true"
      LEXAI_LOW_MEMORY_MODE: "true"
      GLOBAL_JUDGMENT_CORPUS_ENABLED: "false"
      ENABLE_DEVELOPER_TOOLS: "false"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install system dependencies (Poppler & Tesseract)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils tesseract-ocr libgomp1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unit Tests
        run: |
          python test_new_features.py
          python test_feedback_learning.py
          python test_private_evidence_verification.py

      - name: Run Fast RAG Evaluation Gate
        run: |
          python test_rag_evaluation_identifiers.py
          python test_rag_evaluation_v3.py
          python test_retrieval_strategy.py

  frontend-build:
    name: Frontend Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker-validation:
    name: Dockerfile Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (validation)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ai-powered-smartcourtroom:ci-test

  security-checks:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Security Tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: Run Bandit Security Scan
        run: |
          bandit -r . -x ./frontend,./cases_storage,./test_*.py -ll -ii || true
